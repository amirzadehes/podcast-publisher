<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتشار و مدیریت پادکست</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 650px; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: 0 auto 25px auto; border: 1px solid #333; }
        h2, h3 { text-align: center; color: #ffffff; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #b0b0b0; }
        input[type="text"], input[type="password"], input[type="datetime-local"], textarea { width: 100%; padding: 10px; margin-top: 5px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        input:focus, textarea:focus { border-color: #0d6efd; outline: none; }
        input[type="file"] { width: 100%; padding: 8px; margin-top: 5px; background: #252525; border: 1px solid #444; color: #bbb; border-radius: 6px; cursor: pointer; box-sizing: border-box; }
        .platforms { background: #252525; padding: 15px; border-radius: 6px; margin-top: 10px; border: 1px solid #383838; display: flex; flex-direction: column; gap: 12px; }
        .platforms label { margin-top: 0; font-weight: normal; color: #e0e0e0; cursor: pointer; display: flex; align-items: center; }
        .platforms input[type="checkbox"] { margin-left: 8px; transform: scale(1.2); cursor: pointer; }
        button { width: 100%; background: #0d6efd; color: white; border: none; padding: 14px; margin-top: 25px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; font-family: Tahoma, sans-serif; }
        button:hover { background: #0b5ed7; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-secondary { background: #198754; margin-top: 10px; }
        .btn-secondary:hover { background: #157347; }
        #status, #editStatus { margin-top: 15px; text-align: center; font-weight: bold; line-height: 1.6; }
        .ep-item { background: #262626; border: 1px solid #444; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .ep-item input, .ep-item textarea { margin-bottom: 10px; }
        .ep-actions { display: flex; gap: 10px; margin-top: 5px; }
        .ep-save-btn { background: #ffc107; color: #000; padding: 10px; margin-top: 0; font-size: 14px; flex: 2; }
        .ep-save-btn:hover { background: #e0a800; }
        .ep-delete-btn { background: #dc3545; color: #fff; padding: 10px; margin-top: 0; font-size: 14px; flex: 1; }
        .ep-delete-btn:hover { background: #bb2d3b; }
        .search-box { display: none; margin-top: 15px; }
        .pagination { display: none; justify-content: space-between; align-items: center; gap: 10px; margin-top: 20px; background: #252525; padding: 10px 15px; border-radius: 8px; border: 1px solid #383838; }
        .pagination button { margin-top: 0; padding: 10px; font-size: 14px; width: 40%; background: #3b4252; }
        .pagination button:hover:not(:disabled) { background: #4c566a; }
        .page-info { font-size: 14px; color: #ccc; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>انتشار اپیزود جدید</h2>
    
    <label>توکن گیت‌هاب (فقط یک بار وارد کنید):</label>
    <input type="password" id="ghToken" placeholder="ghp_...">

    <label>عنوان اپیزود:</label>
    <input type="text" id="title" placeholder="عنوان اپیزود را وارد کنید">

    <label>توضیحات اپیزود:</label>
    <textarea id="description" rows="4" placeholder="توضیحات کامل اپیزود..."></textarea>

    <label>تگ‌ها</label>
    <input type="text" id="tags" placeholder="تگ_اول تگ_دوم تگ_سوم">

    <label>پلی‌لیست</label>
    <input type="text" id="categoryName" placeholder="مثلاً: Studio 15 یا Katalog یا ذره‌بین">

    <label>زمان انتشار</label>
    <input type="datetime-local" id="publishAt">

    <label>فایل صوتی پادکست (MP3):</label>
    <input type="file" id="audioFile" accept="audio/*">

    <label>یوتیوب</label>
    <input type="file" id="imgHorizontal" accept="image/*">

    <label>اینستاگرام</label>
    <input type="file" id="imgVertical" accept="image/*">

    <label>اسپاتیفای</label>
    <input type="file" id="imgSquare" accept="image/*">

    <label>انتشار در پلتفرم‌های:</label>
    <div class="platforms">
        <label><input type="checkbox" id="platYoutube" checked> YouTube</label>
        <label><input type="checkbox" id="platSpotify" checked> Spotify</label>
        <label><input type="checkbox" id="platInstagram" checked> Instagram</label>
    </div>

    <button onclick="publishEpisode()">ساخت ویدیو و انتشار</button>
    <div id="status"></div>
</div>

<div class="container">
    <h3>مدیریت و ویرایش اپیزودهای اسپاتیفای</h3>
    <button class="btn-secondary" onclick="loadEpisodesForEdit()">نمایش لیست اپیزودها برای ویرایش / حذف</button>
    
    <div id="searchContainer" class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 جستجو در عنوان یا توضیحات اپیزودها..." oninput="handleSearch()">
    </div>

    <div id="editStatus"></div>
    <div id="episodesList"></div>

    <div id="paginationContainer" class="pagination">
        <button id="prevBtn" onclick="changePage(-1)">❮ ۵ اپیزود قبلی</button>
        <span id="pageInfo" class="page-info">صفحه ۱ از ۱</span>
        <button id="nextBtn" onclick="changePage(1)">۵ اپیزود بعدی ❯</button>
    </div>
</div>

<script>
    const owner = 'amirzadehes';
    const repo = 'podcast-publisher';
    const branch = 'main';

    document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                resolve(base64);
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function publishEpisode() {
        const token = document.getElementById('ghToken').value.trim();
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const tagsInput = document.getElementById('tags').value.trim();
        const categoryName = document.getElementById('categoryName').value.trim();
        const publishAtInput = document.getElementById('publishAt').value;
        
        const audioFile = document.getElementById('audioFile').files[0];
        const imgHorizontal = document.getElementById('imgHorizontal').files[0];
        const imgVertical = document.getElementById('imgVertical').files[0];
        const imgSquare = document.getElementById('imgSquare').files[0];

        const platYoutube = document.getElementById('platYoutube').checked;
        const platSpotify = document.getElementById('platSpotify').checked;
        const platInstagram = document.getElementById('platInstagram').checked;

        const statusDiv = document.getElementById('status');

        if (!token || !title || !audioFile) {
            alert('لطفاً توکن، عنوان و فایل صوتی را وارد کنید.');
            return;
        }

        if (platYoutube && !imgHorizontal) {
            alert('برای انتشار در یوتیوب، لطفاً عکس یوتیوب را انتخاب کنید.');
            return;
        }

        if (platInstagram && !imgVertical) {
            alert('برای انتشار در اینستاگرام، لطفاً عکس اینستاگرام را انتخاب کنید.');
            return;
        }

        let publishAtISO = null;
        if (publishAtInput) {
            const selectedDate = new Date(publishAtInput);
            if (selectedDate <= new Date()) {
                alert('زمان انتخاب شده برای انتشار باید در آینده باشد.');
                return;
            }
            publishAtISO = selectedDate.toISOString();
        }

        localStorage.setItem('gh_token', token);
        statusDiv.style.color = '#76d7c4';
        statusDiv.innerText = 'در حال ارسال فایل‌ها به سرور ابری... لطفاً صبر کنید.';

        const jobId = `job_${Date.now()}`;
        const jobFolder = `jobs/${jobId}`;

        try {
            const audioB64 = await fileToBase64(audioFile);
            await sendToGitHub(token, audioB64, `${jobFolder}/audio.mp3`);

            if (imgHorizontal) {
                const hB64 = await fileToBase64(imgHorizontal);
                await sendToGitHub(token, hB64, `${jobFolder}/horizontal.jpg`);
            }

            if (imgVertical) {
                const vB64 = await fileToBase64(imgVertical);
                await sendToGitHub(token, vB64, `${jobFolder}/vertical.jpg`);
            }

            if (imgSquare) {
                const sB64 = await fileToBase64(imgSquare);
                await sendToGitHub(token, sB64, `${jobFolder}/square.jpg`);
            }

            const tagsArray = tagsInput ? tagsInput.split(/\s+/).filter(Boolean) : [];
            const metaData = {
                jobId: jobId,
                podcastId: "zarebin",
                status: "pending",
                title: title,
                description: description,
                tags: tagsArray,
                categoryName: categoryName,
                publishAt: publishAtISO,
                platforms: {
                    youtube: platYoutube,
                    spotify: platSpotify,
                    instagram: platInstagram
                },
                done: {
                    youtube: false,
                    spotify: false,
                    instagram: false
                },
                timestamp: Date.now()
            };

            const metaB64 = btoa(unescape(encodeURIComponent(JSON.stringify(metaData, null, 2))));
            await sendToGitHub(token, metaB64, `${jobFolder}/meta.json`);

            await triggerWorkflow(token);

            statusDiv.style.color = '#2ecc71';
            statusDiv.innerText = '✅ تمام فایل‌ها در صف اختصاصی قرار گرفت! سرور ابری در حال پردازش است.';
        } catch (error) {
            statusDiv.style.color = '#e74c3c';
            statusDiv.innerText = '❌ خطا: ' + error.message;
        }
    }

    async function sendToGitHub(token, base64Content, path) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        let sha = null;
        
        const getRes = await fetch(url, { 
            headers: { 
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json'
            } 
        });
        
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }

        const body = {
            message: `Add/Update ${path}`,
            content: base64Content,
            branch: branch
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!putRes.ok) {
            throw new Error(`خطا در آپلود ${path}`);
        }
    }

    async function triggerWorkflow(token) {
        const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/publish.yml/dispatches`;
        const res = await fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ ref: branch })
        });
        if (!res.ok) {
            throw new Error('فایل‌ها آپلود شدند اما خطایی در راه‌اندازی خودکار سرور رخ داد.');
        }
    }

    let currentFeedXml = '';
    let allEpisodes = [];
    let filteredEpisodes = [];
    let currentPage = 1;
    const pageSize = 5;

    function parseEpisodesFromXml(xmlString) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        const items = xmlDoc.getElementsByTagName("item");
        const list = [];
        for (let i = 0; i < items.length; i++) {
            const titleNode = items[i].getElementsByTagName("title")[0];
            const descNode = items[i].getElementsByTagName("description")[0];
            list.push({
                originalIndex: i,
                title: titleNode ? titleNode.textContent : '',
                description: descNode ? descNode.textContent : ''
            });
        }
        return list;
    }

    async function loadEpisodesForEdit() {
        const token = document.getElementById('ghToken').value.trim();
        const editStatus = document.getElementById('editStatus');
        const listDiv = document.getElementById('episodesList');
        const searchContainer = document.getElementById('searchContainer');
        const paginationContainer = document.getElementById('paginationContainer');

        if (!token) {
            alert('لطفاً ابتدا توکن گیت‌هاب را در بالای صفحه وارد کنید.');
            return;
        }

        editStatus.style.color = '#76d7c4';
        editStatus.innerText = 'در حال دریافت لیست اپیزودها...';
        listDiv.innerHTML = '';
        searchContainer.style.display = 'none';
        paginationContainer.style.display = 'none';

        try {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/feed.xml`;
            const res = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json'
                }
            });

            if (!res.ok) throw new Error('فایل feed.xml یافت نشد.');
            const data = await res.json();
            currentFeedXml = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));

            allEpisodes = parseEpisodesFromXml(currentFeedXml);

            if (allEpisodes.length === 0) {
                editStatus.innerText = 'هیچ اپیزودی در فید یافت نشد.';
                return;
            }

            document.getElementById('searchInput').value = '';
            filteredEpisodes = [...allEpisodes];
            currentPage = 1;

            searchContainer.style.display = 'block';
            renderEpisodesPage();
        } catch (err) {
            editStatus.style.color = '#e74c3c';
            editStatus.innerText = 'خطا: ' + err.message;
        }
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            filteredEpisodes = [...allEpisodes];
        } else {
            filteredEpisodes = allEpisodes.filter(ep =>
                ep.title.toLowerCase().includes(query) ||
                ep.description.toLowerCase().includes(query)
            );
        }
        const totalPages = Math.ceil(filteredEpisodes.length / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        renderEpisodesPage();
    }

    function changePage(direction) {
        const totalPages = Math.ceil(filteredEpisodes.length / pageSize) || 1;
        const nextPage = currentPage + direction;
        if (nextPage >= 1 && nextPage <= totalPages) {
            currentPage = nextPage;
            renderEpisodesPage();
        }
    }

    function renderEpisodesPage() {
        const listDiv = document.getElementById('episodesList');
        const editStatus = document.getElementById('editStatus');
        const paginationContainer = document.getElementById('paginationContainer');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        listDiv.innerHTML = '';

        if (filteredEpisodes.length === 0) {
            editStatus.style.color = '#ffc107';
            editStatus.innerText = 'هیچ اپیزودی یافت نشد.';
            paginationContainer.style.display = 'none';
            return;
        }

        const totalPages = Math.ceil(filteredEpisodes.length / pageSize);
        const startIndex = (currentPage - 1) * pageSize;
        const pageItems = filteredEpisodes.slice(startIndex, startIndex + pageSize);

        editStatus.style.color = '#76d7c4';
        editStatus.innerText = `نمایش ${startIndex + 1} تا ${startIndex + pageItems.length} از مجموع ${filteredEpisodes.length} اپیزود:`;

        pageItems.forEach(ep => {
            const idx = ep.originalIndex;
            const itemBox = document.createElement('div');
            itemBox.className = 'ep-item';
            itemBox.innerHTML = `
                <label>عنوان اپیزود ${idx + 1}:</label>
                <input type="text" id="edit_title_${idx}" value="${ep.title.replace(/"/g, '&quot;')}">
                <label>توضیحات اپیزود ${idx + 1}:</label>
                <textarea rows="3" id="edit_desc_${idx}">${ep.description.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
                <div class="ep-actions">
                    <button class="ep-save-btn" onclick="saveEpisodeEdit(${idx})">ذخیره تغییرات</button>
                    <button class="ep-delete-btn" onclick="deleteEpisode(${idx})">حذف اپیزود</button>
                </div>
            `;
            listDiv.appendChild(itemBox);
        });

        if (totalPages > 1) {
            paginationContainer.style.display = 'flex';
            pageInfo.innerText = `صفحه ${currentPage} از ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        } else {
            paginationContainer.style.display = 'none';
        }
    }

    async function saveEpisodeEdit(index) {
        const token = document.getElementById('ghToken').value.trim();
        const newTitle = document.getElementById(`edit_title_${index}`).value.trim();
        const newDesc = document.getElementById(`edit_desc_${index}`).value.trim();
        const editStatus = document.getElementById('editStatus');

        editStatus.style.color = '#ffc107';
        editStatus.innerText = 'در حال ذخیره تغییرات در فید اسپاتیفای...';

        try {
            let itemCounter = -1;
            const updatedXml = currentFeedXml.replace(/<item>[\s\S]*?<\/item>/g, (match) => {
                itemCounter++;
                if (itemCounter !== index) return match;

                let updatedItem = match.replace(/<title>[\s\S]*?<\/title>/, `<title><![CDATA[${newTitle}]]></title>`);
                updatedItem = updatedItem.replace(/<description>[\s\S]*?<\/description>/, `<description><![CDATA[${newDesc}]]></description>`);
                return updatedItem;
            });

            const b64Xml = btoa(unescape(encodeURIComponent(updatedXml)));
            await sendToGitHub(token, b64Xml, 'feed.xml');
            currentFeedXml = updatedXml;

            const epInAll = allEpisodes.find(e => e.originalIndex === index);
            if (epInAll) {
                epInAll.title = newTitle;
                epInAll.description = newDesc;
            }

            editStatus.style.color = '#2ecc71';
            editStatus.innerText = '✅ تغییرات با موفقیت در فید ذخیره شد و به زودی در اسپاتیفای به‌روزرسانی می‌شود!';
        } catch (err) {
            editStatus.style.color = '#e74c3c';
            editStatus.innerText = '❌ خطا در ذخیره تغییرات: ' + err.message;
        }
    }

    async function deleteEpisode(index) {
        const ep = allEpisodes.find(e => e.originalIndex === index);
        const epTitle = ep ? ep.title : `شماره ${index + 1}`;

        if (!confirm(`آیا از حذف کامل اپیزود «${epTitle}» از فید اسپاتیفای مطمئن هستید؟`)) {
            return;
        }

        const token = document.getElementById('ghToken').value.trim();
        const editStatus = document.getElementById('editStatus');

        editStatus.style.color = '#ffc107';
        editStatus.innerText = 'در حال حذف اپیزود از فید اسپاتیفای...';

        try {
            let itemCounter = -1;
            const updatedXml = currentFeedXml.replace(/\s*<item>[\s\S]*?<\/item>/g, (match) => {
                itemCounter++;
                if (itemCounter === index) return '';
                return match;
            });

            const b64Xml = btoa(unescape(encodeURIComponent(updatedXml)));
            await sendToGitHub(token, b64Xml, 'feed.xml');
            currentFeedXml = updatedXml;

            allEpisodes = parseEpisodesFromXml(currentFeedXml);
            handleSearch();

            editStatus.style.color = '#2ecc71';
            editStatus.innerText = `✅ اپیزود «${epTitle}» با موفقیت از فید اسپاتیفای حذف شد!`;
        } catch (err) {
            editStatus.style.color = '#e74c3c';
            editStatus.innerText = '❌ خطا در حذف اپیزود: ' + err.message;
        }
    }
</script>
</body>
</html>
