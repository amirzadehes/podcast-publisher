<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتشار پادکست</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 500px; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: auto; border: 1px solid #333; }
        h2 { text-align: center; color: #ffffff; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #b0b0b0; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #0d6efd; outline: none; }
        input[type="file"] { padding: 8px; background: #252525; cursor: pointer; }
        button { width: 100%; background: #0d6efd; color: white; border: none; padding: 12px; margin-top: 25px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0b5ed7; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>انتشار اپیزود جدید</h2>
    
    <label>توکن گیت‌هاب (GitHub Token):</label>
    <input type="password" id="ghToken" placeholder="ghp_...">

    <label>عنوان اپیزود:</label>
    <input type="text" id="title" placeholder="مثلاً: قسمت اول - معرفی">

    <label>توضیحات اپیزود:</label>
    <textarea id="description" rows="3" placeholder="توضیحات کامل درباره این قسمت..."></textarea>

    <label>تگ‌ها (جدا شده با فاصله / Space):</label>
    <input type="text" id="tags" placeholder="پادکست مصاحبه تاکسی etaxi">

    <label>فایل صوتی (MP3):</label>
    <input type="file" id="audioFile" accept="audio/*">

    <label>عکس کاور (Jpg / Png):</label>
    <input type="file" id="imageFile" accept="image/*">

    <button onclick="publishEpisode()">انتشار و آپلود</button>
    <div id="status"></div>
</div>

<script>
    document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

    async function publishEpisode() {
        const token = document.getElementById('ghToken').value.trim();
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const tagsInput = document.getElementById('tags').value.trim();
        const audioInput = document.getElementById('audioFile').files[0];
        const imageInput = document.getElementById('imageFile').files[0];
        const statusDiv = document.getElementById('status');

        if (!token || !title || !audioInput || !imageInput) {
            alert('لطفاً توکن، عنوان، فایل صوتی و عکس را وارد کنید.');
            return;
        }

        localStorage.setItem('gh_token', token);
        statusDiv.style.color = '#76d7c4';
        statusDiv.innerText = 'در حال آپلود فایل‌ها به گیت‌هاب...';

        const owner = 'amirzadehes';
        const repo = 'podcast-publisher';
        const branch = 'main';

        try {
            await uploadFileToGitHub(token, owner, repo, branch, audioInput, 'temp/audio.mp3');
            await uploadFileToGitHub(token, owner, repo, branch, imageInput, 'temp/horizontal.jpg');
            
            // جداسازی تگ‌ها با فاصله (Space) به جای کاما
            const tagsArray = tagsInput ? tagsInput.split(/\s+/) : [];
            const metaContent = JSON.stringify({ title, description, tags: tagsArray });
            await uploadTextToGitHub(token, owner, repo, branch, metaContent, 'temp/meta.json');

            statusDiv.style.color = '#2ecc71';
            statusDiv.innerText = '✅ تمام فایل‌ها ارسال شد! سرور ابری در حال ساخت ویدیو و انتشار است.';
        } catch (error) {
            statusDiv.style.color = '#e74c3c';
            statusDiv.innerText = '❌ خطا: ' + error.message;
        }
    }

    async function uploadFileToGitHub(token, owner, repo, branch, file, path) {
        const arrayBuffer = await file.arrayBuffer();
        const base64Content = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
        return sendToGitHub(token, owner, repo, branch, base64Content, path);
    }

    async function uploadTextToGitHub(token, owner, repo, branch, text, path) {
        const base64Content = btoa(unescape(encodeURIComponent(text)));
        return sendToGitHub(token, owner, repo, branch, base64Content, path);
    }

    async function sendToGitHub(token, owner, repo, branch, base64Content, path) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        let sha = null;
        const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }

        const body = {
            message: `Upload ${path}`,
            content: base64Content,
            branch: branch
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!putRes.ok) throw new Error(`خطا در آپلود ${path}`);
    }
</script>
</body>
</html>
