<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتشار پادکست</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: auto; border: 1px solid #333; }
        h2 { text-align: center; color: #ffffff; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #b0b0b0; }
        input[type="text"], input[type="password"], input[type="datetime-local"], textarea { width: 100%; padding: 10px; margin-top: 5px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #0d6efd; outline: none; }
        input[type="file"] { width: 100%; padding: 8px; margin-top: 5px; background: #252525; border: 1px solid #444; color: #bbb; border-radius: 6px; cursor: pointer; box-sizing: border-box; }
        .platforms { background: #252525; padding: 15px; border-radius: 6px; margin-top: 10px; border: 1px solid #383838; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .platforms label { margin-top: 0; font-weight: normal; color: #e0e0e0; cursor: pointer; display: flex; align-items: center; }
        .platforms input[type="checkbox"] { margin-left: 8px; transform: scale(1.2); cursor: pointer; }
        button { width: 100%; background: #0d6efd; color: white; border: none; padding: 14px; margin-top: 25px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0b5ed7; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>انتشار اپیزود جدید</h2>
    
    <label>توکن گیت‌هاب (فقط یک بار وارد کنید):</label>
    <input type="password" id="ghToken" placeholder="ghp_...">

    <label>عنوان اپیزود:</label>
    <input type="text" id="title" placeholder="عنوان اپیزود را وارد کنید">

    <label>توضیحات اپیزود:</label>
    <textarea id="description" rows="4" placeholder="توضیحات کامل اپیزود..."></textarea>

    <label>تگ‌ها (با فاصله / Space از هم جدا کنید):</label>
    <input type="text" id="tags" placeholder="تگ_اول تگ_دوم تگ_سوم">

    <label>دسته‌بندی / پلی‌لیست (در صورت نبودن، خودکار ساخته می‌شود):</label>
    <input type="text" id="categoryName" placeholder="مثلاً: Studio 15 یا Katalog">

    <label>زمان انتشار (اختیاری - برای انتشار فوری خالی بگذارید):</label>
    <input type="datetime-local" id="publishAt">

    <label>فایل صوتی پادکست (MP3):</label>
    <input type="file" id="audioFile" accept="audio/*">

    <label>عکس افقی ۱۶:۹ (مخصوص یوتیوب - 1920x1080):</label>
    <input type="file" id="imgHorizontal" accept="image/*">

    <label>عکس عمودی ۹:۱۶ (مخصوص اینستاگرام و تیک‌تاک - 1080x1920):</label>
    <input type="file" id="imgVertical" accept="image/*">

    <label>عکس مربعی ۱:۱ (مخصوص کاور اسپاتیفای - 1080x1080):</label>
    <input type="file" id="imgSquare" accept="image/*">

    <label>انتشار در پلتفرم‌های:</label>
    <div class="platforms">
        <label><input type="checkbox" id="platYoutube" checked> یوتیوب (YouTube)</label>
        <label><input type="checkbox" id="platSpotify" checked> اسپاتیفای (Spotify RSS)</label>
        <label><input type="checkbox" id="platInstagram" checked> اینستاگرام (Instagram)</label>
        <label><input type="checkbox" id="platTiktok" checked> تیک‌تاک (TikTok)</label>
    </div>

    <button onclick="publishEpisode()">ساخت ویدیو و انتشار</button>
    <div id="status"></div>
</div>

<script>
    document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                resolve(base64);
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function publishEpisode() {
        const token = document.getElementById('ghToken').value.trim();
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const tagsInput = document.getElementById('tags').value.trim();
        const categoryName = document.getElementById('categoryName').value.trim();
        const publishAtInput = document.getElementById('publishAt').value;
        
        const audioFile = document.getElementById('audioFile').files[0];
        const imgHorizontal = document.getElementById('imgHorizontal').files[0];
        const imgVertical = document.getElementById('imgVertical').files[0];
        const imgSquare = document.getElementById('imgSquare').files[0];

        const platYoutube = document.getElementById('platYoutube').checked;
        const platSpotify = document.getElementById('platSpotify').checked;
        const platInstagram = document.getElementById('platInstagram').checked;
        const platTiktok = document.getElementById('platTiktok').checked;

        const statusDiv = document.getElementById('status');

        if (!token || !title || !audioFile) {
            alert('لطفاً توکن، عنوان و فایل صوتی را وارد کنید.');
            return;
        }

        if (platYoutube && !imgHorizontal) {
            alert('برای انتشار در یوتیوب، لطفاً عکس افقی (۱۶:۹) را انتخاب کنید.');
            return;
        }

        if ((platInstagram || platTiktok) && !imgVertical) {
            alert('برای انتشار در اینستاگرام یا تیک‌تاک، لطفاً عکس عمودی (۹:۱۶) را انتخاب کنید.');
            return;
        }

        let publishAtISO = null;
        if (publishAtInput) {
            const selectedDate = new Date(publishAtInput);
            if (selectedDate <= new Date()) {
                alert('زمان انتخاب شده برای انتشار باید در آینده باشد.');
                return;
            }
            publishAtISO = selectedDate.toISOString();
        }

        localStorage.setItem('gh_token', token);
        statusDiv.style.color = '#76d7c4';
        statusDiv.innerText = 'در حال ارسال فایل‌ها به سرور ابری گیت‌هاب... لطفاً صبر کنید.';

        const owner = 'amirzadehes';
        const repo = 'podcast-publisher';
        const branch = 'main';

        try {
            const audioB64 = await fileToBase64(audioFile);
            await sendToGitHub(token, owner, repo, branch, audioB64, 'temp/audio.mp3');

            if (imgHorizontal) {
                const hB64 = await fileToBase64(imgHorizontal);
                await sendToGitHub(token, owner, repo, branch, hB64, 'temp/horizontal.jpg');
            }

            if (imgVertical) {
                const vB64 = await fileToBase64(imgVertical);
                await sendToGitHub(token, owner, repo, branch, vB64, 'temp/vertical.jpg');
            }

            if (imgSquare) {
                const sB64 = await fileToBase64(imgSquare);
                await sendToGitHub(token, owner, repo, branch, sB64, 'temp/square.jpg');
            }

            const tagsArray = tagsInput ? tagsInput.split(/\s+/).filter(Boolean) : [];
            const metaData = {
                title: title,
                description: description,
                tags: tagsArray,
                categoryName: categoryName,
                publishAt: publishAtISO,
                platforms: {
                    youtube: platYoutube,
                    spotify: platSpotify,
                    instagram: platInstagram,
                    tiktok: platTiktok
                },
                done: {
                    youtube: false,
                    spotify: false,
                    instagram: false,
                    tiktok: false
                },
                timestamp: Date.now()
            };

            const metaB64 = btoa(unescape(encodeURIComponent(JSON.stringify(metaData, null, 2))));
            await sendToGitHub(token, owner, repo, branch, metaB64, 'temp/meta.json');

            await triggerWorkflow(token, owner, repo, branch);

            statusDiv.style.color = '#2ecc71';
            statusDiv.innerText = '✅ تمام فایل‌ها ارسال شد! سرور ابری بر اساس تنظیمات و زمان‌بندی شما عمل خواهد کرد.';
        } catch (error) {
            statusDiv.style.color = '#e74c3c';
            statusDiv.innerText = '❌ خطا: ' + error.message;
        }
    }

    async function sendToGitHub(token, owner, repo, branch, base64Content, path) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        let sha = null;
        
        const getRes = await fetch(url, { 
            headers: { 
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json'
            } 
        });
        
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }

        const body = {
            message: `Upload ${path}`,
            content: base64Content,
            branch: branch
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!putRes.ok) {
            throw new Error(`خطا در آپلود ${path}`);
        }
    }

    async function triggerWorkflow(token, owner, repo, branch) {
        const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/publish.yml/dispatches`;
        const res = await fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ ref: branch })
        });
        if (!res.ok) {
            throw new Error('فایل‌ها آپلود شدند اما خطایی در راه‌اندازی خودکار سرور رخ داد.');
        }
    }
</script>
</body>
</html>
